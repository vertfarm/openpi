<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HV1 · Episode Review</title>
<style>
:root{font:15px system-ui,sans-serif;color:#dfe7ee;background:#101820}*{box-sizing:border-box}body{margin:0}header{padding:22px 32px;border-bottom:1px solid #344450;display:flex;align-items:center;justify-content:space-between}h1{font-size:22px;margin:0}small{color:#9bb0bf}.badge{background:#234a43;color:#a7ead4;padding:5px 10px;border-radius:6px}main{display:grid;grid-template-columns:330px 1fr;min-height:80vh}aside{padding:20px;border-right:1px solid #344450}article{padding:24px;min-width:0}button,select,input,textarea{font:inherit;color:inherit;background:#1b2a35;border:1px solid #506477;border-radius:6px;padding:9px}button{cursor:pointer}button:hover{background:#304858}button:disabled{opacity:.4;cursor:not-allowed}.episode{display:block;width:100%;text-align:left;margin:10px 0}.episode.active{border-color:#73d9b7}.views{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.views img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#070e14;border-radius:8px}.views p{color:#a6b9c6;margin:6px 0}.row{display:flex;gap:12px;align-items:center;margin:18px 0;flex-wrap:wrap}input[type=range]{flex:1;min-width:150px}textarea{width:100%;height:65px}pre{white-space:pre-wrap;color:#a8cadb;background:#14222d;padding:14px;border-radius:8px}#error{color:#ffb6ab;min-height:24px}#counts{margin-top:14px}#synthetic{color:#ffce82}label{display:flex;gap:6px;align-items:center}.approve{background:#245548}section{margin-top:20px}@media(max-width:900px){main{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #344450}.views{grid-template-columns:1fr}}
</style>
<header><div><h1>HV1 <small>Episode Review</small></h1><small>문종술 선임 ROS2 recorder → 검수 → 학습 목록</small></div><span class="badge">로봇 명령 없음 · 원본 읽기 전용</span></header>
<main><aside><button onclick="scan()">완료 에피소드 다시 검사</button><div id="counts"></div><p id="synthetic"></p><div id="episodes"></div></aside>
<article><h2 id="title">에피소드를 선택하세요</h2><p id="task"></p><div id="error" role="alert"></div><div class="views" id="views"></div>
<div class="row"><button id="play" disabled onclick="togglePlay()">재생</button><input id="frame" disabled type="range" min="0" max="0" value="0" oninput="showFrame()"><span id="position"></span></div>
<pre id="values">프레임별 측정 state와 commanded action을 구분해 표시합니다.</pre>
<section><h3>검수 판정</h3><div class="row"><select id="outcome"><option value="unknown">미판정</option><option value="success">성공</option><option value="failure">실패</option><option value="aborted">중단</option></select><label><input type="checkbox" id="use">첫 기준선 학습에 포함</label></div><textarea id="reason" placeholder="제외 사유 / 현장 메모"></textarea><div class="row"><button id="save" disabled class="approve" onclick="saveReview()">판정 저장</button><small>품질 통과 + 성공 판정만 학습에 포함할 수 있습니다. 실패 데이터는 보존됩니다.</small></div></section>
</article></main>
<script>
const csrf='__CSRF__';let rows=[],selected=null,timer=null,busy=false;
const $=id=>document.getElementById(id);const error=e=>$('error').textContent=String(e.message||e);
async function api(url,data){let opts=data?{method:'POST',headers:{'Content-Type':'application/json','X-HV1-CSRF':csrf},body:JSON.stringify(data)}:{};let r=await fetch(url,opts);let v=await r.json();if(!r.ok)throw Error(v.error);return v;}
async function load(){try{let d=await api('/api/episodes');rows=d.episodes;$('counts').textContent=`${rows.length}개 · 품질 통과 ${rows.filter(x=>x.quality_pass&&!x.superseded).length} · 학습 선택 ${rows.filter(x=>x.review.use&&!x.superseded).length}`;$('synthetic').textContent=d.synthetic?'SYNTHETIC · 합성 테스트이며 실제 로봇 데이터가 아닙니다.':'';$('episodes').replaceChildren();for(let row of rows){let b=document.createElement('button');b.className='episode'+(selected?.id===row.id?' active':'');b.textContent=`${row.episode_id||row.id.slice(0,10)} · ${row.superseded?'이전 원본':row.quality_pass?'QA 통과':'QA 차단'} · ${row.review.outcome||'미검수'}`;b.onclick=()=>select(row);$('episodes').append(b);}}catch(e){error(e)}}
function stop(){clearInterval(timer);timer=null;$('play').textContent='재생'}
async function select(row){stop();selected=row;$('error').textContent='';$('title').textContent=row.episode_id||'미완료 에피소드';$('task').textContent=row.task||'';$('frame').max=Math.max(0,(row.frames||1)-1);$('frame').value=0;let blocked=!row.quality_pass||row.superseded;for(let key of ['frame','play'])$(key).disabled=blocked;$('save').disabled=row.superseded;$('outcome').value=row.review.outcome||'unknown';$('use').checked=!!row.review.use;$('reason').value=row.review.reason||'';$('views').replaceChildren();if(blocked){$('values').textContent=(row.errors||[]).join('\n');error(row.superseded?'원본이 변경되었습니다. 새 항목을 검수하세요.':'품질 검사 실패: '+row.errors.join('; '));}else await showFrame();await load()}
async function showFrame(){if(!selected||busy)return;busy=true;let id=selected.id,index=$('frame').value;try{let q=`id=${id}&frame=${index}`;let d=await api('/api/frame?'+q);if(selected.id!==id)return;$('position').textContent=`${Number(index)+1} / ${selected.frames}`;$('values').textContent=`timestamp_ns: ${d.timestamp_ns}\n측정 state: ${JSON.stringify(d.state)}\n명령 action: ${JSON.stringify(d.action)}`;$('views').replaceChildren();for(let slot of d.slots){let box=document.createElement('div'),img=document.createElement('img'),label=document.createElement('p');img.src='/api/image?'+q+'&slot='+slot;img.alt=slot;label.textContent=slot;box.append(img,label);$('views').append(box)}}catch(e){stop();error(e)}finally{busy=false}}
function togglePlay(){if(timer){stop();return}$('play').textContent='일시정지';timer=setInterval(()=>{if(busy)return;let v=Number($('frame').value);if(v>=Number($('frame').max)){stop();return}$('frame').value=v+1;showFrame()},200)}
async function saveReview(){try{await api('/api/review',{id:selected.id,outcome:$('outcome').value,use:$('use').checked,reason:$('reason').value});$('error').textContent='판정 저장 완료';await load()}catch(e){error(e)}}
async function scan(){stop();try{await api('/api/scan',{});await load()}catch(e){error(e)}}load();
</script></html>
